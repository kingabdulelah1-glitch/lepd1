<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSPD Operations Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#060a13;--bg2:#0a111f;--panel:#0e1729;--panel2:#13203a;--line:#1c2d4d;--line2:#2a4470;
  --text:#e9eff8;--muted:#8ea0bd;--steel:#5b8bb8;--steel2:#9dbbdb;--gold:#d8a935;--gold2:#f2cd6b;
  --red:#ec5258;--amber:#f4a73b;--green:#33c790;--blue:#4f8dfd;
  --side:#050912;--sidetext:#b7c5dc;--sidehover:#0f1c33;--sideline:#14223d;
  --shadow:0 10px 32px rgba(0,0,0,.4);--r:10px;
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--fb:'Barlow','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#edf1f7;--bg2:#e3e9f2;--panel:#ffffff;--panel2:#f1f5fa;--line:#d6dfec;--line2:#b4c5dc;
  --text:#0c1830;--muted:#56688a;--steel:#2d5d93;--steel2:#3c6ea6;--gold:#9a6f0c;--gold2:#8a6200;
  --red:#c9363c;--amber:#b36a00;--green:#14805a;--blue:#2860d8;
  --side:#0a1a36;--sidetext:#c3d0e6;--sidehover:#14284d;--sideline:#1d3358;
  --shadow:0 10px 28px rgba(20,40,80,.14);color-scheme:light;
}
html[lang="ar"]{--fd:'Tajawal','Segoe UI',Tahoma,sans-serif;--fb:'Tajawal','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--steel2)}
.ic{flex:none;vertical-align:middle}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:var(--sw,252px) minmax(0,1fr);min-height:100vh}
.app.collapsed{--sw:74px}
.side{background:var(--side);color:var(--sidetext);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-inline-end:1px solid var(--sideline);z-index:40;overflow:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--sideline);min-height:72px}
.brand svg{width:42px;height:42px;flex:none}
.brand b{display:block;font:700 21px/1 var(--fd);letter-spacing:.05em;color:#fff}
.brand small{display:block;color:var(--steel);font-size:12px;margin-top:3px}
.nav{flex:1;overflow:auto;padding:10px 0}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 14px;margin:2px 8px;border-radius:8px;color:var(--sidetext);text-decoration:none;cursor:pointer;font-weight:500;border-inline-start:3px solid transparent;white-space:nowrap}
.nav a:hover{background:var(--sidehover);color:#fff}
.nav a.on{background:var(--sidehover);color:#fff;border-inline-start-color:var(--gold)}
.nav a .cnt{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.nav .sep{margin:12px 20px 4px;font-size:12px;color:var(--steel);font-weight:600}
.sidefoot{border-top:1px solid var(--sideline);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.sidefoot .btn{background:transparent;color:var(--sidetext);border-color:var(--sideline);justify-content:center}
.collapsed .lbl,.collapsed .brand div,.collapsed .sidefoot .meta,.collapsed .nav .sep,.collapsed .cnt{display:none}
.collapsed .nav a{justify-content:center;padding-inline:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:10px;align-items:center;padding:10px 20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .grow{flex:1}
.dropwrap{position:relative}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text);position:relative}
.icon-btn:hover{border-color:var(--steel)}
.icon-btn .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:38px;padding-inline:38px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);outline-offset:0}
.search .ic{position:absolute;inset-inline-start:11px;top:10px;color:var(--muted)}
.drop{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:320px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);z-index:60;max-height:72vh;overflow:auto}
.search .drop{inset-inline-start:0;inset-inline-end:auto;width:100%}
.drop h4{margin:0;padding:10px 14px 4px;font:600 13px var(--fd);color:var(--gold)}
.drop .row{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer;border-top:1px solid var(--line);font-size:14px;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.drop .row:hover{background:var(--panel2)}
.drop .row small{color:var(--muted);display:block}
.main{padding:22px 24px 64px;max-width:1560px;width:100%;margin:0 auto}
.scrim{display:none}

/* typography & primitives */
h1.pt{font:700 32px/1.05 var(--fd);margin:0;letter-spacing:.01em}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.split{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h3,.ct{margin:0 0 12px;font:600 18px/1.2 var(--fd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ct small{font:400 12px var(--fb);color:var(--muted)}
.kpi{cursor:pointer;border-inline-start:3px solid var(--steel);padding:13px 15px;transition:border-color .15s,background .15s}
.kpi:hover{background:var(--panel2)}
.kpi .n{font:700 38px/1 var(--fd)}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi.gold{border-inline-start-color:var(--gold)}.kpi.gold .n{color:var(--gold2)}
.kpi.green{border-inline-start-color:var(--green)}.kpi.amber{border-inline-start-color:var(--amber)}.kpi.red{border-inline-start-color:var(--red)}
.bd{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.bd::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.bd.green{--c:var(--green)}.bd.amber{--c:var(--amber)}.bd.red{--c:var(--red)}.bd.steel{--c:var(--steel2)}.bd.gold{--c:var(--gold2)}.bd.blue{--c:var(--blue)}
.bd.p1{--c:var(--red)}.bd.p2{--c:var(--amber)}.bd.p3{--c:var(--green)}.bd.p4{--c:var(--steel2)}
.bd.nodot::before{display:none}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--steel2);margin:1px 2px}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1400}
.btn.red{background:color-mix(in srgb,var(--red) 18%,transparent);border-color:var(--red);color:var(--red)}
.btn.green{background:color-mix(in srgb,var(--green) 18%,transparent);border-color:var(--green);color:var(--green)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ico{padding:5px 7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;padding:9px 12px;color:var(--muted);font-weight:600;font-size:13px;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--text)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--panel2)}
.tbl tr.click{cursor:pointer}
.tbl td.act{white-space:nowrap}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tab{padding:10px 16px;cursor:pointer;color:var(--muted);border:0;border-bottom:2px solid transparent;background:none;white-space:nowrap;font-weight:600}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input,.filters select,.fld input,.fld select,.fld textarea,.inl{height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);min-width:0}
.fld textarea{height:auto;padding:8px 10px;width:100%;resize:vertical}
.filters input{min-width:220px}
.pillset{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.pill.on{background:var(--steel);border-color:var(--steel);color:#fff}
.mut{color:var(--muted)}
.gold-t{color:var(--gold2)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1.5px solid var(--steel);font:700 13px var(--fd);flex:none}
.av.cmd{border-color:var(--gold);color:var(--gold2)}
.av.lg{width:64px;height:64px;font-size:22px}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.kv div small{display:block;color:var(--muted);font-size:12px}
.kv div b{font-weight:500}
.tl{border-inline-start:2px solid var(--line2);margin-inline-start:6px;padding-inline-start:18px}
.tl .it{position:relative;padding-bottom:16px}
.tl .it::before{content:'';position:absolute;inset-inline-start:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--panel)}
.tl .it.s::before{background:var(--steel)}.tl .it.r::before{background:var(--red)}.tl .it.g::before{background:var(--green)}
.tl .it small{color:var(--muted);display:block}
.feed .fi{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed .fi:last-child{border:0}
.feed .fi time{color:var(--muted);font-size:12px;min-width:48px;font-variant-numeric:tabular-nums}
.feed .fi a{cursor:pointer;color:var(--steel2);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.hbar{display:grid;grid-template-columns:130px 1fr 38px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .t{height:9px;background:var(--bg2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--steel)}
.hbar b{text-align:end;font-variant-numeric:tabular-nums}
.pb{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--green)}
.chart{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axl{fill:var(--muted);font:11px var(--fb)}
.chart .val{fill:var(--text);font:600 11px var(--fb)}
.donut{width:150px;flex:none}.donut .dn{fill:var(--text);font:700 24px var(--fd)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:8px}
.dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* command banner */
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:16px 20px;margin-bottom:14px;border-radius:var(--r);border:1px solid var(--line2);background:linear-gradient(100deg,#0f2142 0%,#0b1630 55%,#09101f 100%);color:#e9eff8;position:relative;overflow:hidden}
:root[data-theme="light"] .banner{background:linear-gradient(100deg,#13305f,#0e2247)}
.banner .clock{font:700 44px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.banner .clock small{display:block;font:500 13px var(--fb);color:var(--steel2);letter-spacing:0;margin-top:4px}
.banner .mid{display:flex;gap:26px;flex-wrap:wrap}
.banner .mid div small{display:block;color:var(--steel2);font-size:12px}
.banner .mid div b{font:600 19px var(--fd);color:#fff}
.banner .mid .g b{color:var(--gold2)}
.simtag{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.simtag i{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 1.8s infinite}
.simtag.off i{animation:none;background:var(--muted)}.simtag.off{border-color:var(--muted);color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 70%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.p1row td:first-child{box-shadow:inset 3px 0 0 var(--red)}
[dir=rtl] .p1row td:first-child{box-shadow:inset -3px 0 0 var(--red)}

/* map */
.map{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);width:100%;height:auto;display:block}
.map .zone{fill:var(--panel);stroke:var(--line2);stroke-width:1.2}
.map .zone:hover{fill:var(--panel2)}
.map .zn{fill:var(--muted);font:600 13px var(--fd)}
.map .road{stroke:var(--line2);stroke-width:5;opacity:.5;fill:none}
.map .u{cursor:pointer}.map .ul{fill:var(--text);font:600 10px var(--fb);paint-order:stroke;stroke:var(--bg2);stroke-width:3}
.map .callp{animation:pulse2 1.6s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.35}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--muted);font-size:12px;padding:4px}
.cal .d{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;background:var(--bg2);min-width:0}
.cal .d.today{border-color:var(--gold)}.cal .d.o{opacity:.35}
.cal .d b{font:600 13px var(--fd)}
.cal .ev{display:block;margin-top:2px;padding:0 5px;border-radius:4px;font-size:11px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--steel) 30%,transparent);cursor:pointer}
.cal .ev.ceremony{background:color-mix(in srgb,var(--gold) 30%,transparent)}.cal .ev.training{background:color-mix(in srgb,var(--green) 28%,transparent)}.cal .ev.operation{background:color-mix(in srgb,var(--red) 28%,transparent)}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(2,6,14,.72);display:grid;place-items:center;z-index:100;padding:14px}
.mdl{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(700px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mdl.wide{width:min(980px,100%)}
.mdl>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mdl>header h2{margin:0;font:700 22px var(--fd)}
.mdl .mb{padding:18px;overflow:auto}
.mdl>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.full{grid-column:1/-1}
.fld label{font-size:13px;color:var(--muted);font-weight:600}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px}
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--panel2);border:1px solid var(--line2);border-inline-start:4px solid var(--steel);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:340px;font-size:14px}
.toast.ok{border-inline-start-color:var(--green)}.toast.err{border-inline-start-color:var(--red)}
.lock{max-width:520px;margin:60px auto;text-align:center}
.lock .ic{color:var(--gold)}
pre.dump{white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;background:var(--bg2);padding:10px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
textarea.big{width:100%;min-height:150px;padding:8px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.scorebar{display:flex;gap:3px}.scorebar i{width:18px;height:8px;border-radius:2px;background:var(--line2)}.scorebar i.f{background:var(--gold)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% 0%,color-mix(in srgb,var(--steel) 14%,transparent),transparent),var(--bg)}
.lg-card{display:grid;grid-template-columns:1fr 1fr;width:min(920px,100%);border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.lg-brand{padding:40px 36px;background:linear-gradient(140deg,#11264b 0%,var(--panel) 75%);border-inline-end:1px solid var(--line)}
.lg-brand svg{width:64px;height:64px}
.lg-brand h1{font:700 38px/1.05 var(--fd);margin:22px 0 14px;color:var(--text)}
.lg-brand p{color:var(--muted);margin:0;max-width:340px}
.lg-form{padding:32px 34px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.lg-top{display:flex;justify-content:space-between;align-items:center}
.lg-top h2{margin:0;font:700 24px var(--fd)}
.lg-form .fld input{height:46px;width:100%;padding:0 12px;background:var(--bg2)}
.lg-btn{height:46px;border-radius:9px;border:0;background:var(--gold);color:#1d1400;font-weight:700;font-size:15px;cursor:pointer}
.lg-btn:hover{filter:brightness(1.08)}.lg-btn[disabled]{opacity:.6;cursor:wait}
.lg-err{color:var(--red);font-size:14px;min-height:20px}
.lg-note{border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border-radius:9px;padding:10px 12px;font-size:13px}
@media (max-width:760px){.lg-card{grid-template-columns:1fr}.lg-brand{border-inline-end:0;border-bottom:1px solid var(--line);padding:26px}.lg-brand h1{font-size:30px}}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:272px;height:100dvh;transform:translateX(-102%);transition:transform .2s}
  [dir=rtl] .side{transform:translateX(102%)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}
  .app.collapsed{--sw:1fr}.collapsed .lbl,.collapsed .brand div,.collapsed .sidefoot .meta,.collapsed .nav .sep{display:revert}
  .collapsed .nav a{justify-content:flex-start;padding-inline:14px}
  .hide-m{display:none!important}
  .main{padding:16px 14px 64px}

function donut(data){
  const tot=data.reduce((a,d)=>a+d.v,0),r=42,C=2*Math.PI*r;let off=0;
  let s=`<svg viewBox="0 0 120 120" class="donut" role="img"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="14"/>`;
  data.forEach(d=>{if(!d.v)return;const len=C*d.v/(tot||1);s+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${d.c}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"><title>${esc(d.l)}: ${d.v}</title></circle>`;off+=len});
  s+=`<text x="60" y="63" text-anchor="middle" class="dn">${tot}</text></svg>`;
  return `<div class="dwrap">${s}<div class="legend">${data.map(d=>`<span><i style="background:${d.c}"></i>${esc(d.l)} — <b>${d.v}</b></span>`).join('')}</div></div>`;
}

function setSt(c,st,quiet){

async function startSession(j){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=username,role,is_active&id=eq.${encodeURIComponent(j.user.id)}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+j.access_token}});
  const rows=await r.json();
  if(!r.ok||!Array.isArray(rows)||!rows.length||!rows[0].is_active)throw new Error('inactive');
  AUTH.user={id:j.user.id,username:rows[0].username,role:rows[0].role,token:j.access_token};AUTH.ok=true;AUTH.demo=false;
  try{localStorage.setItem(AKEY,JSON.stringify({refresh:j.refresh_token}))}catch(e){}
  S.settings.role=rows[0].role;UI.lgu='';commit();
}
async function doLogin(u,p){
  const err=$('#lgerr'),btn=$('#lgbtn');btn.disabled=true;err.textContent='';UI.lgu=u;
  try{
    const email=u.includes('@')?u:u.toLowerCase().replace(/\s+/g,'')+'@lspd.local';
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:p})});
    if(!r.ok)throw new Error('cred');
    await startSession(await r.json());
  }catch(e){
    const m=e&&e.message;
    err.textContent=m==='cred'?T('Invalid username or password.','اسم المستخدم أو كلمة المرور غير صحيحة.'):m==='inactive'?T('Your account has not been activated by Command yet.','لم تقم القيادة بتفعيل حسابك بعد.'):T('Cannot reach the server. Check the connection settings.','تعذّر الاتصال بالخادم. تحقق من إعدادات الاتصال.');
    btn.disabled=false;
  }
}
async function tryRestore(){
  if(!CFG())return;
  try{
    const st=JSON.parse(localStorage.getItem(AKEY)||'null');if(!st||!st.refresh)return;
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:st.refresh})});
    if(!r.ok){localStorage.removeItem(AKEY);return}
    await startSession(await r.json());
  }catch(e){}
}

  render();
};

/* ================= Analytics ================= */
function vAnalytics(){
  const act=S.officers.filter(o=>o.status!=='archived'),calls=S.calls;
  const days=[...Array(14)].map((_,i)=>isoDay(Date.now()-(13-i)*DAY)),dl=days.map(d=>String(+d.slice(8)));
  const perDay=days.map(d=>calls.filter(c=>isoDay(c.ts)===d).length);
  const rts=calls.filter(c=>c.rt!=null).map(c=>c.rt),avg=rts.length?Math.round(rts.reduce((x,y)=>x+y,0)/rts.length):null;
  const respDay=days.map(d=>{const r=calls.filter(c=>c.rt!=null&&isoDay(c.ts)===d).map(c=>c.rt);return r.length?Math.round(r.reduce((x,y)=>x+y,0)/r.length):0});
  const hrs=Array.from({length:24},(_,h)=>({l:h%3===0?String(h):'',v:calls.filter(c=>new Date(c.ts).getHours()===h).length}));
  const dec=S.reports.filter(r=>r.dec),appr=dec.length?Math.round(dec.reduce((x,r)=>x+(r.dec.ts-r.ts),0)/dec.length/3600000):null;
  const closedPct=calls.length?Math.round(100*calls.filter(c=>c.st==='closed').length/calls.length)+'%':'—';
  const byType=Object.keys(CALLTYPES).map(k=>({l:lb(CALLTYPES,k),v:calls.filter(c=>c.type===k).length})).filter(x=>x.v).sort((x,y)=>y.v-x.v).slice(0,8);
  const divs=Object.keys(DIVS).map(k=>({l:lb(DIVS,k),v:act.filter(o=>o.div===k).length}));
  const ranks=RANKS.map((r,i)=>({l:r[2],v:act.filter(o=>o.rank===i).length,c:isCmd(i)?'var(--gold)':'var(--steel)'}));
  const pr=[1,2,3,4].map(p=>({l:'P'+p+' '+lb(PRI,p),v:calls.filter(c=>c.pr===p).length,c:['var(--red)','var(--amber)','var(--green)','var(--steel)'][p-1]}));
  const ofh=act.filter(isOn).reduce((x,o)=>x+(o.duty[0]&&o.duty[0].open?Math.max(0,Math.round((Date.now()-(o.duty[0].t0||Date.now()))/3600000)):0),0);
  const k=(n,l,c)=>`<div class="card kpi ${c||''}" style="cursor:default"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  return ph(T('Command Analytics','تحليلات القيادة'),T('Calculated from the data you enter.','محسوبة من البيانات التي تدخلها.'),`<button class="btn" data-act="exportan">${ic('dl',16)}${T('Export KPIs','تصدير المؤشرات')}</button>`)+
  `<div class="grid kpis">${k(avg==null?'—':Math.floor(avg/60)+':'+String(avg%60).padStart(2,'0'),T('Avg response time (min)','متوسط زمن الاستجابة (د)'),'gold')}${k(perDay.reduce((x,y)=>x+y,0),T('Calls — last 14 days','بلاغات — آخر 14 يوم'))}${k(closedPct,T('Closure rate','نسبة الإغلاق'),'green')}${k(appr==null?'—':appr+'h',T('Avg report approval time','متوسط زمن اعتماد التقرير'),'amber')}${k(ofh,T('Officer-hours on duty now','ساعات العمل الجارية'))}</div>
  <div class="grid c2" style="margin-top:14px"><div class="card"><h3>${T('Calls per day','البلاغات يوميًا')}</h3>${lineChart(perDay,dl,{every:2})}</div><div class="card"><h3>${T('Response time trend (seconds)','اتجاه زمن الاستجابة (ثانية)')}</h3>${lineChart(respDay,dl,{color:'var(--steel2)',every:2})}</div>
  <div class="card"><h3>${T('Calls by hour of day','البلاغات حسب الساعة')}</h3>${barChart(hrs,{color:'var(--gold)'})}</div><div class="card"><h3>${T('Priority mix','توزيع الأولويات')}</h3>${donut(pr)}</div>
  <div class="card"><h3>${T('Top call types','أكثر أنواع البلاغات')}</h3>${byType.length?hbars(byType):empty(T('No calls yet','لا بلاغات بعد'))}</div><div class="card"><h3>${T('Division manning','قوة الأقسام')}</h3>${hbars(divs,'var(--gold)')}</div>
  <div class="card"><h3>${T('Rank distribution','توزيع الرتب')}</h3>${barChart(ranks)}</div></div>`;
}

function vHub(){

  const {y,m}=UI.cal,first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),off=first.getDay(),today=isoDay(Date.now());
  const wd=LANG==='ar'?['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells=wd.map(w=>`<div class="h">${w}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div class="d o"></div>';
  for(let d=1;d<=dim;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cells+=`<div class="d ${ds===today?'today':''}"><b>${d}</b>${S.events.filter(e=>e.date===ds).map(e=>`<span class="ev ${e.type}" data-act="evinfo" data-id="${e.id}" title="${esc(tx(e.title))}">${e.time} ${esc(tx(e.title))}</span>`).join('')}</div>`}
  const mname=new Date(y,m,1).toLocaleDateString(loc(),{month:'long',year:'numeric'});
  const anns=[...S.ann].sort((a,b)=>b.pin-a.pin||b.ts-a.ts);
  return ph(T('Announcements & Events','التعاميم والفعاليات'),T('Department bulletins and the command calendar.','نشرات القسم وتقويم القيادة.'),can('announce')?`<button class="btn" data-act="newevt">${ic('cal',16)}${T('Add event','إضافة فعالية')}</button><button class="btn gold" data-act="newann">${ic('mega',16)}${T('Post announcement','نشر تعميم')}</button>`:'')+
  `<div class="grid split" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)"><div class="card"><h3>${T('Announcements','التعاميم')}</h3>${anns.map(a=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(tx(a.title))}</b>${a.pin?bd(T('Pinned','مثبّت'),'gold'):''}${bd(a.cat,'steel')}</div><div class="mut" style="margin:4px 0">${esc(tx(a.body))}</div><small class="mut">${esc(nm(a.by))} · ${ago(a.ts)}</small>${can('announce')?` <button class="btn sm ico" data-act="delann" data-id="${a.id}" aria-label="delete">${ic('x',13)}</button>`:''}</div>`).join('')}</div>
  <div class="card"><div class="ct"><button class="btn sm ico" data-act="calnav" data-d="-1" aria-label="prev">${ic(LANG==='ar'?'right':'left',15)}</button><span>${esc(mname)}</span><button class="btn sm ico" data-act="calnav" data-d="1" aria-label="next">${ic(LANG==='ar'?'left':'right',15)}</button></div><div class="cal">${cells}</div></div></div>`;
}
ACT.calnav=d=>{let {y,m}=UI.cal;m+=+d.d;if(m<0){m=11;y--}if(m>11){m=0;y++}UI.cal={y,m};render()};
ACT.evinfo=d=>{const e=S.events.find(x=>x.id===d.id);openModal(tx(e.title),`<div class="kv"><div><small>${T('Date','التاريخ')}</small><b>${fD(e.date)}</b></div><div><small>${T('Time','الوقت')}</small><b>${e.time}</b></div><div><small>${T('Type','النوع')}</small><b>${esc(lb(EVT,e.type))}</b></div></div>`,(can('announce')?`<button class="btn red" data-act="delevt" data-id="${e.id}">${T('Delete','حذف')}</button>`:'')+`<button class="btn pri" data-act="close">${T('Close','إغلاق')}</button>`,{nofocus:1})};
ACT.delevt=d=>{S.events=S.events.filter(x=>x.id!==d.id);closeModal();commit()};
ACT.delann=d=>{S.ann=S.ann.filter(x=>x.id!==d.id);commit()};
function annForm(){
  if(!need('announce'))return;
  FM(T('Post announcement','نشر تعميم'),[{k:'t',label:T('Title','العنوان'),req:1,full:1},{k:'b',type:'textarea',rows:4,full:1,label:T('Message','النص'),req:1},{k:'cat',type:'select',label:T('Category','التصنيف'),opts:[['general',T('General','عام')],['policy',T('Policy','سياسة')],['training',T('Training','تدريب')],['briefing',T('Briefing','إحاطة')]]},{k:'pin',type:'select',label:T('Pin to top','تثبيت'),opts:[['0',T('No','لا')],['1',T('Yes','نعم')]]}],v=>{S.ann.unshift({id:'AN-'+(++S.seq.ann),title:{en:v.t,ar:v.t},body:{en:v.b,ar:v.b},cat:v.cat,pin:v.pin==='1',ts:Date.now(),by:'LSPD-1001'});UI.view='hub';commit();toast(T('Announcement posted','تم نشر التعميم'),'ok')});
}
ACT.newevt=()=>{if(!need('announce'))return;FM(T('Add event','إضافة فعالية'),[{k:'t',label:T('Title','العنوان'),req:1,full:1},{k:'date',type:'date',label:T('Date','التاريخ'),val:isoDay(Date.now()+DAY)},{k:'time',type:'time',label:T('Time','الوقت'),val:'20:00'},{k:'type',type:'select',label:T('Type','النوع'),opts:opt(EVT)}],v=>{S.events.push({id:'EV-'+(++S.seq.ev),date:v.date,time:v.time,title:{en:v.t,ar:v.t},type:v.type});commit();toast(T('Event added','تمت إضافة الفعالية'),'ok')})};

/* ================= Setup & data ================= */
function vSetup(){
  const d=S.settings.dept,cnt=[['officers',T('Officers','العساكر'),S.officers.length],['units',T('Units','الوحدات'),S.units.length],['calls',T('Calls','البلاغات'),S.calls.length],['reports',T('Reports','التقارير'),S.reports.length],['sessions',T('Training sessions','دورات التدريب'),S.sessions.length],['cases',T('IA cases','قضايا الشؤون الداخلية'),S.cases.length],['ann',T('Announcements','التعاميم'),S.ann.length],['events',T('Events','الفعاليات'),S.events.length]];
  return ph(T('Setup & Data','الإعدادات والبيانات'),T('Department settings, roles and backups.','إعدادات القسم والأدوار والنسخ الاحتياطي.'))+
  `<div class="grid c2"><div class="card"><h3>${T('Department','القسم')}</h3><div class="kv"><div><small>${T('Name (EN)','الاسم (إنجليزي)')}</small><b>${esc(d.en)}</b></div><div><small>${T('Name (AR)','الاسم (عربي)')}</small><b>${esc(d.ar)}</b></div><div><small>${T('Server','السيرفر')}</small><b>${esc(d.server)}</b></div></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn" data-act="editdept">${ic('edit',15)}${T('Edit details','تعديل البيانات')}</button></div></div>
  <div class="card"><h3>${T('Data overview','نظرة على البيانات')}</h3><div class="kv">${cnt.map(c=>`<div><small>${c[1]}</small><b>${c[2]}</b></div>`).join('')}</div></div>
  <div class="card"><h3>${T('Roles & permissions','الأدوار والصلاحيات')}</h3><div class="scroll"><table class="tbl"><thead><tr><th></th>${Object.keys(ROLES).map(r=>`<th>${esc(lb(ROLES,r))}</th>`).join('')}</tr></thead><tbody>${Object.keys(PERMN).map(p=>`<tr><td>${esc(lb(PERMN,p))}</td>${Object.keys(ROLES).map(r=>`<td>${PERM[r][p]?bd('✓','green nodot'):'<span class="mut">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="sub">${T('Everyone can file reports and view the directory. Use the profile menu to try each role.','يمكن للجميع تقديم التقارير وعرض الجدول. استخدم قائمة الملف الشخصي لتجربة كل دور.')}</div></div>
  <div class="card"><h3>${T('Backup & restore','النسخ الاحتياطي والاستعادة')}</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="backup">${ic('dl',16)}${T('Export backup (JSON)','تصدير نسخة (JSON)')}</button><button class="btn" data-act="restoreb">${T('Import backup','استيراد نسخة')}</button><button class="btn red" data-act="resetdemo">${T('Wipe all data','مسح كل البيانات')}</button></div><div class="sub" style="margin-top:8px">${T('Changes are saved in this browser only.','التغييرات تُحفظ في هذا المتصفح فقط.')}</div></div>
  <div class="card"><h3>${T('Ranks','الرتب')}${can('setup')?`<button class="btn sm" data-act="go" data-to="ranks">${ic('edit',14)}${T('Manage ranks','إدارة الرتب')}</button>`:''}</h3>${RANKS.map((r,i)=>`<span class="chip" style="${isCmd(i)?'color:var(--gold2)':''}">${esc(r[LANG==='ar'?1:0])}</span>`).join('')}<h3 style="margin-top:14px">${T('Divisions','الأقسام')}</h3>${opt(DIVS).map(([,l])=>`<span class="chip">${esc(l)}</span>`).join('')}</div></div>`;
}
ACT.editdept=()=>{if(!need('setup'))return;const d=S.settings.dept;FM(T('Edit department','تعديل القسم'),[{k:'en',label:T('Name (EN)','الاسم (إنجليزي)'),val:d.en,req:1},{k:'ar',label:T('Name (AR)','الاسم (عربي)'),val:d.ar,req:1},{k:'server',label:T('Server name','اسم السيرفر'),val:d.server,full:1}],v=>{S.settings.dept={en:v.en,ar:v.ar,server:v.server};commit()})};
ACT.togsim=()=>{if(!need('setup'))return;S.settings.sim=!S.settings.sim;commit()};
ACT.backup=()=>{if(!need('setup'))return;saveFile('lspd-backup-'+isoDay(Date.now())+'.json',JSON.stringify(S,null,1))};
ACT.restoreb=()=>{if(!need('setup'))return;UI.formCb=fd=>{try{const x=JSON.parse(fd.get('j'));if(!x||x.v!==3||!x.officers)throw 0;const st=S.settings;S=x;S.settings={...S.settings,...st};applyRanks();syncUnits(S);commit();toast(T('Backup restored','تمت الاستعادة'),'ok')}catch(e){toast(T('Invalid backup file','ملف النسخة غير صالح'),'err');return false}};openModal(T('Import backup','استيراد نسخة'),`<form id="mform"><div class="fld"><label for="j">${T('Paste backup JSON','الصق محتوى JSON')}</label><textarea class="big" id="j" name="j" required></textarea></div></form>`,`<button class="btn" data-act="close">${T('Cancel','إلغاء')}</button><button class="btn pri" type="submit" form="mform">${T('Import','استيراد')}</button>`)};
ACT.resetdemo=()=>{if(!need('setup'))return;FM(T('Wipe all data?','مسح كل البيانات؟'),[{k:'ok',type:'select',label:T('This deletes all current data in this browser.','سيتم حذف كل البيانات الحالية في هذا المتصفح.'),full:1,opts:[['no',T('No, keep my data','لا، احتفظ ببياناتي')],['yes',T('Yes, wipe everything','نعم، امسح كل شيء')]]}],v=>{if(v.ok==='yes'){const st=S.settings;S=seed();S.settings={...S.settings,...st};applyRanks();commit();toast(T('All data wiped','تم مسح البيانات'),'ok')}})};

/* ================= Rank management ================= */
const remapRanks=fn=>S.officers.forEach(o=>{o.rank=fn(o.rank);(o.promos||[]).forEach(p=>{p.rank=fn(p.rank)})});
const rkHeld=i=>S.officers.filter(o=>o.rank===i).length;
function vRanks(){
  const sw=(i)=>`<span style="display:inline-block;transform:rotate(180deg)">${ic('up',15)}</span>`;
  return ph(T('Rank Management','إدارة الرتب'),T('The order is the seniority (top = highest). Renaming never affects officers; reordering moves officers together with their rank.','الترتيب هو الأقدمية (الأعلى = الأكبر). تغيير الاسم لا يؤثر على العساكر، وإعادة الترتيب تنقل العساكر مع رتبهم.'),`<button class="btn gold" data-act="addrank">${ic('plus',16)}${T('Add rank','إضافة رتبة')}</button>`)+
  `<div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>${T('Name (EN)','الاسم (إنجليزي)')}</th><th>${T('Name (AR)','الاسم (عربي)')}</th><th>${T('Abbr.','الاختصار')}</th><th>${T('Level','المستوى')}</th><th>${T('Officers','العساكر')}</th><th>${T('Actions','الإجراءات')}</th></tr></thead><tbody>${RANKS.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${r[3]?bd(T('Command','قيادة'),'gold'):''} ${r[4]?bd(T('Supervises','يشرف'),'steel'):''}</td><td>${rkHeld(i)}</td><td class="act"><button class="btn sm ico" data-act="rankmv" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="${T('Move up','أعلى')}">${ic('up',15)}</button> <button class="btn sm ico" data-act="rankmv" data-i="${i}" data-d="1" ${i===RANKS.length-1?'disabled':''} aria-label="${T('Move down','أسفل')}">${sw(i)}</button> <button class="btn sm ico" data-act="editrank" data-i="${i}" aria-label="${T('Edit','تعديل')}">${ic('edit',15)}</button> <button class="btn sm ico red" data-act="delrank" data-i="${i}" aria-label="${T('Delete','حذف')}">${ic('x',15)}</button></td></tr>`).join('')}</tbody></table></div><div class="sub" style="margin-top:10px">${T('"Command" ranks are shown in gold. "Supervises" ranks can be chosen as an officer\'s supervisor.','رتب "قيادة" تظهر بالذهبي. رتب "يشرف" يمكن اختيارها كمشرف للعسكري.')}</div></div>`;
}
const yn=()=>[['1',T('Yes','نعم')],['0',T('No','لا')]];
function rankFields(r,withPos){
  const f=[{k:'en',label:T('Name (EN)','الاسم (إنجليزي)'),val:r?r[0]:'',req:1},{k:'ar',label:T('Name (AR)','الاسم (عربي)'),val:r?r[1]:'',req:1},{k:'abbr',label:T('Abbreviation','الاختصار'),val:r?r[2]:''},{k:'cmd',type:'select',label:T('Command rank (gold)','رتبة قيادة (ذهبي)'),val:r&&r[3]?'1':'0',opts:yn()},{k:'sup',type:'select',label:T('Can be a supervisor','يمكن أن يكون مشرفاً'),val:r&&r[4]?'1':'0',opts:yn()}];
  if(withPos)f.push({k:'pos',type:'select',label:T('Insert position','مكان الإضافة'),val:RANKS.length,opts:[...RANKS.map((x,i)=>[i,T('Before: ','قبل: ')+x[LANG==='ar'?1:0]]),[RANKS.length,T('At the end (lowest)','في النهاية (الأدنى)')]]});
  return f;
}
ACT.addrank=()=>{if(!need('setup'))return;FM(T('Add rank','إضافة رتبة'),rankFields(null,true),v=>{
  const p=Math.min(Math.max(0,+v.pos),RANKS.length);remapRanks(r=>r>=p?r+1:r);
  RANKS.splice(p,0,[v.en,v.ar,v.abbr||v.en.slice(0,4).toUpperCase(),v.cmd==='1'?1:0,v.sup==='1'?1:0]);syncRK();commit();toast(T('Rank added','تمت إضافة الرتبة'),'ok')})};
ACT.editrank=d=>{if(!need('setup'))return;const i=+d.i,r=RANKS[i];FM(T('Edit rank','تعديل رتبة'),rankFields(r,false),v=>{
  RANKS[i]=[v.en,v.ar,v.abbr||r[2],v.cmd==='1'?1:0,v.sup==='1'?1:0];syncRK();commit();toast(T('Rank updated','تم تحديث الرتبة'),'ok')})};
ACT.rankmv=d=>{if(!need('setup'))return;const i=+d.i,j=i+ +d.d;if(j<0||j>=RANKS.length)return;
  remapRanks(r=>r===i?j:r===j?i:r);[RANKS[i],RANKS[j]]=[RANKS[j],RANKS[i]];syncRK();commit()};
ACT.delrank=d=>{if(!need('setup'))return;const i=+d.i,n=rkHeld(i);
  if(RANKS.length<=1){toast(T('At least one rank is required','يلزم وجود رتبة واحدة على الأقل'),'err');return}
  if(n){toast(T(n+' officer(s) hold this rank. Move them to another rank first.','يوجد '+n+' عسكري بهذه الرتبة. انقلهم لرتبة أخرى أولاً.'),'err');return}
  FM(T('Delete rank?','حذف الرتبة؟')+' — '+RANKS[i][LANG==='ar'?1:0],[{k:'ok',type:'select',full:1,label:T('Promotion history entries that used this rank will point to the nearest rank.','سجلات الترقية التي استخدمت هذه الرتبة ستشير لأقرب رتبة.'),opts:[['no',T('No, keep it','لا، احتفظ بها')],['yes',T('Yes, delete','نعم، احذف')]]}],v=>{
    if(v.ok!=='yes')return;RANKS.splice(i,1);remapRanks(r=>r>i?r-1:(r===i?Math.min(i,RANKS.length-1):r));syncRK();commit();toast(T('Rank deleted','تم حذف الرتبة'))},{save:T('Confirm','تأكيد')})};

/* ================= boot ================= */
S=load();applyRanks();LANG=S.settings.lang||'en';
fromHash();
render();
tryRestore();
setInterval(()=>{document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=new Date().toLocaleTimeString(loc(),{hour12:false}))},1000);
setInterval(tick,12000);
</script>
</body>
</html>
